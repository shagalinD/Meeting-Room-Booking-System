services:
  booking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: booking
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      BOOKING_GRPC_ADDR: ":50051"
    expose:
      - "50051"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  room:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: room
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      ROOM_GRPC_ADDR: ":50052"
    expose:
      - "50052"
    depends_on:
      database:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: auth
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      AUTH_GRPC_ADDR: ":50053"
    expose:
      - "50053"
    depends_on:
      database:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AUTH_GRPC_ADDR: auth:50053
      ROOM_GRPC_ADDR: room:50052
      BOOKING_GRPC_ADDR: booking:50051
    expose:
      - "8081"
    depends_on:
      auth:
        condition: service_started
      room:
        condition: service_started
      booking:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      server:
        condition: service_healthy

  database:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_volume:/var/lib/postgresql

  adminer:
    image: adminer:latest
    ports:
      - '8083:8080'
    environment:
      ADMINER_DEFAULT_SERVER: database
      ADMINER_DEFAULT_USER: ${POSTGRES_USER}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      ADMINER_DEFAULT_DB: ${POSTGRES_DB}
    depends_on:
      - database

  cache:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_volume:
    driver: local
  redis_volume:
    driver: local
  nginx_certs:
    driver: local
